name: Validate
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Package and smoke test native application
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac --dir --publish never --config.mac.identity=-
          npm run smoke:packaged
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package and smoke test native application
        if: runner.os == 'Windows'
        run: |
          npx electron-builder --win --dir --x64 --publish never
          npm run smoke:packaged
