name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      MAC_SIGNING_READY: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
          - name: Windows
            os: windows-latest
            command: npm run dist:win
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate release version
        shell: bash
        run: node scripts/verify-release.mjs
      - name: Build distributables
        run: ${{ matrix.command }}
        env:
          WAYBETTER_GOOGLE_CLIENT_ID: ${{ vars.WAYBETTER_GOOGLE_CLIENT_ID || secrets.WAYBETTER_GOOGLE_CLIENT_ID }}
          WAYBETTER_GOOGLE_REDIRECT_PORT: ${{ vars.WAYBETTER_GOOGLE_REDIRECT_PORT || '53682' }}
          WAYBETTER_MICROSOFT_CLIENT_ID: ${{ vars.WAYBETTER_MICROSOFT_CLIENT_ID || secrets.WAYBETTER_MICROSOFT_CLIENT_ID }}
          WAYBETTER_MICROSOFT_REDIRECT_PORT: ${{ vars.WAYBETTER_MICROSOFT_REDIRECT_PORT || '53685' }}
          WAYBETTER_TEAMS_CLIENT_ID: ${{ vars.WAYBETTER_TEAMS_CLIENT_ID || secrets.WAYBETTER_TEAMS_CLIENT_ID }}
          WAYBETTER_TEAMS_REDIRECT_PORT: ${{ vars.WAYBETTER_TEAMS_REDIRECT_PORT || '53684' }}
          CSC_LINK: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Verify packaged startup and local event lifecycle
        run: npm run smoke:packaged
      - name: Verify signed Mac distribution
        if: runner.os == 'macOS' && env.MAC_SIGNING_READY == 'true'
        shell: bash
        run: node scripts/verify-mac-release.mjs
        env:
          WAYBETTER_REQUIRE_SIGNED_RELEASE: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && 'true' || 'false' }}
      - name: Generate checksums
        run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*SHA256SUMS.txt
          if-no-files-found: error
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        env:
          MAC_SIGNING_READY: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          MAC_CERTIFICATE_CONFIGURED: ${{ secrets.MAC_CSC_LINK != '' }}
        with:
          generate_release_notes: true
          body: |
            ${{ env.MAC_SIGNING_READY == 'true' && 'macOS artifacts are Developer ID signed and Apple notarized.' || env.MAC_CERTIFICATE_CONFIGURED == 'true' && 'macOS artifacts use a configured signing certificate, but Apple notarization has not been verified. These unknown developer builds may trigger macOS Gatekeeper warnings.' || 'macOS artifacts are unsigned by an identified developer and are not Apple notarized. These unknown developer builds may trigger macOS Gatekeeper warnings.' }}
          draft: false
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
